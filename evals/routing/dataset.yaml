  - {text: "открой-ка телегу", expect: direct, intent: app.launch, entity: telegram, tags: [ru, launch, colloquial]}
  - {text: "джарвис, запусти стим", expect: direct, intent: app.launch, entity: steam, tags: [ru, launch, colloquial]}
  - {text: "ну открой хром", expect: direct, intent: app.launch, entity: chrome, tags: [ru, launch, colloquial]}
  - {text: "запусти браузер", expect: direct, intent: app.launch, entity: firefox, tags: [ru, launch, synonym]}
  - {text: "открой веб браузер", expect: direct, intent: app.launch, entity: firefox, tags: [ru, launch, synonym]}
  - {text: "открой VS Code", expect: direct, intent: app.launch, entity: vscode, tags: [mixed, launch]}
  - {text: "запусти Visual Studio Code", expect: direct, intent: app.launch, entity: vscode, tags: [mixed, launch]}
