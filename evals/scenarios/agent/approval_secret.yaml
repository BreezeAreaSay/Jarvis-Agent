# Файл ключа: модель просит, человек разрешает, вызов доводится до конца после ожидания.
id: agent.approval_secret
category: agent
input: "покажи сертификат server.pem"
client: {approval: approve}
files:
  keys/server.pem: "-----BEGIN CERTIFICATE-----"
model:
  replies:
    - json: {decision: "Прочитаю сертификат", action: {type: tool, tool: filesystem.read_text, arguments: {path: keys/server.pem}}}
    - json: {decision: "Показываю начало", action: {type: finish, answer: "Сертификат начинается с BEGIN CERTIFICATE.", evidence: [task_1.call_1]}}
expect:
  status: COMPLETED
  transitions: [ROUTING, PLANNING, EXECUTING, WAITING_CONFIRMATION, EXECUTING, VERIFYING, COMPLETED]
  observations: [executed]
  rules: [approval.approved, zone.secrets.read]
