# Модель выбирает инструмент, Tool Runtime его исполняет, модель отвечает со ссылкой на вызов.
id: agent.list_files
category: agent
input: "какие файлы лежат в рабочей папке?"
files:
  notes.txt: "заметки"
  report.pdf: "%PDF"
  src/: ""
model:
  replies:
    - json: {decision: "Посмотрю содержимое рабочей папки", action: {type: tool, tool: filesystem.list, arguments: {path: "."}}}
    - json: {decision: "Перечисляю найденное", action: {type: finish, answer: "В папке: notes.txt, report.pdf и папка src.", evidence: [task_1.call_1]}}
expect:
  status: COMPLETED
  transitions: [ROUTING, PLANNING, EXECUTING, VERIFYING, COMPLETED]
  tool_events: [tool.previewed, policy.decided, tool.started, tool.finished, tool.verified]
  observations: [executed]
  rules: [effect.read]
  answer_contains: ["notes.txt", "report.pdf"]
  usage: {steps: 2, model_calls: 2, tool_calls: 1, failures: 0}
