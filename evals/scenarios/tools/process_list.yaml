# process.list: снимок процессов только для чтения.
id: tool.process_list
category: tools
input: "scripted: какие процессы запущены?"
script:
  - {status: ROUTING, next: EXECUTING, route: direct}
  - status: EXECUTING
    next: VERIFYING
    tool: {id: process.list, arguments: {max_results: 5}, expect: executed}
  - {status: VERIFYING, next: COMPLETED, answer: "процессы перечислены"}
expect:
  status: COMPLETED
  tool_events: [tool.previewed, policy.decided, tool.started, tool.finished, tool.verified]
  rules: [effect.read]
