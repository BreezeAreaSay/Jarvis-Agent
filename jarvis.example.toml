mode = "normal"                      # normal | local

[ui]
hotkey = "ctrl+alt+space"
autohide_s = 1.2
width = 720                          # ширина окна, px
backdrop = "solid"                   # solid | acrylic (Windows 11; не вышло — сплошной фон)
animations = true                    # false — без анимаций
orb = "always"                       # сфера на рабочем столе: always | auto (при хоткее и работе) | off
orb_size = 64                        # диаметр сферы на рабочем столе, px (40..160)

[hands]
url = "http://127.0.0.1:8081"
model = "4b"                         # 4b | 8b — передаётся аргументом в server_cmd
server_cmd = ['C:\Jarvis\scripts\start_hands.cmd']
max_tokens = 128
timeout_s = 4
min_tokens_per_s = { "4b" = 60, "8b" = 35 }   # ниже — VRAM переполнена, предупреждение

[brain]
model_quick = "gpt-6-luna"           # вопросы и «gpt: …» (имена — Codex().models())
model_deep = "gpt-6-luna"            # «думай: …» — та же модель, дольше думает
effort_quick = "low"                 # уровень размышления: minimal | low | medium | high | xhigh | max
effort_deep = "high"                 # для «думай: …»; xhigh/max — ещё дольше и дороже по квоте
persona = "jarvis"                   # манера речи: jarvis — как Джарвис из «Железного человека»; plain — нейтрально
address = "сэр"                      # как обращаться к вам (persona = jarvis)
service_tier = ""                    # "fast" — быстрее, но больше расход квоты
proxy = ""                           # "http://127.0.0.1:7890", если GPT только через прокси
fallback_provider = ""               # пусто; DeepSeek через Responses API не проверен (см. S5)
idle_new_thread_min = 20

[pc]
es_path = 'C:\Jarvis\bin\es.exe'
private_paths = []

[aliases]
"телега" = "Telegram"
"хром" = "Google Chrome"

[journal]
store_text = true

[vision]
enabled = true                       # «посмотри на экран», «окно: вопрос» — снимок уходит GPT; false — выключено
max_side = 1600                      # длинная сторона снимка для GPT, px (640..2560)
jpeg_quality = 80                    # качество JPEG (50..95)
hide_jarvis = true                   # окна Jarvis не попадают в снимки экрана (Windows 10 2004+)
deny_apps = []                       # чьи окна не отправлять, например ["Telegram.exe"]; менеджеры паролей — всегда

[voice]
ptt_key = "right ctrl"               # удерживай и говори; "" — голосовой ввод выключен (f9, caps lock, altgr…)
min_hold_ms = 250                    # короче — обычное нажатие клавиши, не голос
max_record_s = 30                    # предел одной фразы, с
device = ""                          # микрофон: часть имени из «Параметры → Звук»; "" — по умолчанию
model = "gigaam-v3"                  # gigaam-v3 | gigaam-v3-punct | gigaam-v2 | vosk-small (scripts\get_voice_models.ps1)
threads = 2                          # потоков CPU на распознавание и синтез (1..8)
vad = true                           # обрезать тишину по краям (Silero VAD)
tts = "voice"                        # ответ голосом: voice — на сказанное голосом, always — на всё, off — молча
tts_voice = "ruslan"                 # голос: ruslan | denis | dmitri | irina (папка <data>\models\tts-<имя>)
tts_speed = 1.0                      # скорость речи (0.5..2.0)
tts_pitch = 1.0                      # тон: меньше 1 — ниже (0.8..1.2)
tts_effect = 0.35                    # «электроника» в голосе: 0 — без эффекта, 1 — сильно
tts_dict = true                      # словарь ударений и «ё» Jarvis; false — исходный словарь espeak-ng
