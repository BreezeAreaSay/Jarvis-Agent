[project]
name = "jarvis-core"
version = "2.1.0"
description = "Jarvis — голосовой ассистент для Windows: ядро (голос, команды, ИИ, плагины)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx[socks]>=0.28",
  "numpy>=2.0",
  "sounddevice>=0.5",
  # голос: распознавание, VAD и синтез — sherpa-onnx (версии ядра и обёртки совпадают — ABI)
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "rapidfuzz>=3.9",
  "psutil>=6.0",
  "edge-tts>=7.0",
  "mcp>=1.29,<2",
  "pynput>=1.7.7",
  "mss>=9.0",
  "pillow>=11.0",
  "qrcode>=8.0",
  "send2trash>=1.8.3",
  "soundcard>=0.4.3",
  "miniaudio>=1.61",
  "beautifulsoup4>=4.12",
  "pywin32>=308; sys_platform == 'win32'",
  "pycaw>=20240316; sys_platform == 'win32'",
  "comtypes>=1.4.8; sys_platform == 'win32'",
  "uiautomation>=2.0.20; sys_platform == 'win32'",
  "winrt-runtime>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Media.SpeechSynthesis>=3.0; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications>=3.0; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications.Management>=3.0; sys_platform == 'win32'",
  "winrt-Windows.ApplicationModel>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# OpenCV (+110 МБ) — только для автоблокировки по камере; в установщик не входит, скачивается по кнопке
camera = ["opencv-python-headless>=4.10"]
# ChatGPT по подписке через Codex (+150 МБ) — скачивается по кнопке в настройках Jarvis AI
chatgpt = ["openai-codex==0.163.0"]

[project.scripts]
jarvis-core = "jarvis.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["windows: нужен настоящий Windows"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Кириллица в строках и комментариях — намеренно.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]
