[project]
name = "jarvis"
version = "1.0.0"
description = "Jarvis — персональный помощник для Windows: грамматика, локальная модель и GPT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "openai-codex==0.160.1",
    "mcp>=1.29,<2",
    "psutil>=7.0",
    "rapidfuzz>=3.13",
    "send2trash>=1.8.3",
    "PySide6-Essentials>=6.9",
    "pywin32>=311; sys_platform == 'win32'",
    "pycaw>=20251023; sys_platform == 'win32'",
    "comtypes>=1.4.11; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]
build = ["pyinstaller>=6.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis", "src/pc"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: нужен настоящий рабочий стол, GPU, Everything, сеть или вход в GPT — запускает только человек"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]
# эталонные скрипты задания 00 — проверены на ПК владельца, держим без изменений
extend-exclude = ["scripts/brain_smoke.py", "scripts/es_check.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# тесты ревью S8 берут фикстуры из tests/test_app.py импортом — параметр с тем же именем это и есть фикстура
"tests/test_s8_*.py" = ["F811"]
