  - {text: "show running processes", expect: direct, intent: process.list, tags: [en, process]}
  - {text: "show python processes", expect: direct, intent: process.list, entity: python, tags: [en, process]}
  - {text: "list processes named node", expect: direct, intent: process.list, entity: node, tags: [en, process]}
  - {text: "what processes are running?", expect: direct, intent: process.list, tags: [en, process]}

  # --- прямые команды, которых Router пока не понимает (полнота): их выполнит агент ------------
  - {text: "врубай телегу", expect: direct, intent: app.launch, entity: telegram, tags: [ru, launch, colloquial, missed], note: "глагола нет в словаре"}
  - {text: "открой папку с загрузками", expect: direct, intent: folder.open, entity: "folder:downloads", tags: [ru, folder, missed]}
  - {text: "покажи процессы хрома", expect: direct, intent: process.list, entity: chrome, tags: [ru, process, missed], note: "разговорных имён программ ядро не знает"}
  - {text: "покажи процессы питон", expect: direct, intent: process.list, entity: python, tags: [ru, process, colloquial, missed]}
