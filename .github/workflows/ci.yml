name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Ядро (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check jarvis tests
      - run: uv run ruff format --check jarvis tests
      - run: uv run pytest -q

  desktop:
    name: Интерфейс
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build

  installer:
    name: Установщик Windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [core, desktop]
    runs-on: windows-latest
    permissions:
      contents: write  # релиз по тегу
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pwsh -File scripts/build-win.ps1
        env:
          # подпись — если в настройках репозитория заданы эти секреты; нет — установщик без подписи
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup
          path: |
            desktop/release/Jarvis-Setup-*.exe
            desktop/release/Jarvis-Setup-*.exe.blockmap
            desktop/release/latest.yml
      # тег vX.Y.Z — сразу релиз GitHub с установщиком (заметки — docs/releases/vX.Y.Z.md): установленный
      # Jarvis увидит обновление сам
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) { ./scripts/publish-release.ps1 -NotesFile $notes }
          else { ./scripts/publish-release.ps1 -Notes "Jarvis $env:GITHUB_REF_NAME" }
