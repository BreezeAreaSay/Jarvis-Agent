# system.cwd: рабочая папка задачи — без эффектов, политика разрешает без правил о путях.
id: tool.cwd
category: tools
input: "scripted: в какой папке я работаю?"
script:
  - {status: ROUTING, next: EXECUTING, route: direct}
  - status: EXECUTING
    next: VERIFYING
    tool: {id: system.cwd, expect: executed}
  - {status: VERIFYING, next: COMPLETED, answer: "рабочая папка найдена"}
expect:
  status: COMPLETED
  tool_events: [tool.previewed, policy.decided, tool.started, tool.finished, tool.verified]
  rules: [effect.none]
  found: ["."]
