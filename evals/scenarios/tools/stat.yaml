# filesystem.stat: сведения об одном файле.
id: tool.stat
category: tools
input: "scripted: сколько весит отчёт?"
files:
  docs/report.txt: "двенадцать"
script:
  - {status: ROUTING, next: EXECUTING, route: direct}
  - status: EXECUTING
    next: VERIFYING
    tool: {id: filesystem.stat, arguments: {path: docs/report.txt}, expect: executed}
  - {status: VERIFYING, next: COMPLETED, answer: "размер известен"}
expect:
  status: COMPLETED
  tool_events: [tool.previewed, policy.decided, tool.started, tool.finished, tool.verified]
  found: [docs/report.txt]
