# Отмена посреди такта: клиент отменяет задачу, пока стадия выполняется.
id: runtime.cancel
category: runtime
input: "scripted: долгий шаг, который отменяют"
client: {cancel_on_hang: true}
script:
  - {status: ROUTING, next: PLANNING, route: agent, reason: "маршрут agent"}
  - {status: PLANNING, next: EXECUTING, reason: "план принят"}
  - {status: EXECUTING, next: VERIFYING, charge: {steps: 1}, hang: true, reason: "долгий шаг"}
expect:
  status: CANCELLED
  transitions: [ROUTING, PLANNING, EXECUTING, CANCELLED]
  usage: {steps: 1}
  error_category: task_cancelled
