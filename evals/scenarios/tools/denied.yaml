# Данные Jarvis недоступны инструментам: отказ политики — значение для стадии, исполнения нет.
id: tool.denied
category: tools
input: "scripted: прочитай базу Jarvis"
script:
  - {status: ROUTING, next: EXECUTING, route: direct}
  - status: EXECUTING
    next: VERIFYING
    tool: {id: filesystem.read_text, arguments: {path: "{jarvis_home}/data/jarvis.db"}, expect: denied}
  - {status: VERIFYING, next: COMPLETED, answer: "доступ запрещён политикой"}
expect:
  status: COMPLETED
  usage: {tool_calls: 0}
  tool_events: [tool.previewed, policy.decided]
  tool_outcomes: [denied]
  rules: [zone.internal]
