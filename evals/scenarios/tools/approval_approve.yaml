# Файл с ключом: нужно подтверждение. Задача ждёт, человек одобряет, вызов доводится до конца.
id: tool.approval_approve
category: tools
input: "scripted: прочитай server.pem"
client: {approval: approve}
files:
  keys/server.pem: "-----BEGIN CERTIFICATE-----"
script:
  - {status: ROUTING, next: EXECUTING, route: direct}
  - status: EXECUTING
    next: VERIFYING
    tool: {id: filesystem.read_text, arguments: {path: keys/server.pem}, expect: executed}
  - {status: VERIFYING, next: COMPLETED, answer: "прочитано с разрешения"}
expect:
  status: COMPLETED
  transitions: [ROUTING, EXECUTING, WAITING_CONFIRMATION, EXECUTING, VERIFYING, COMPLETED]
  tool_events: [tool.previewed, policy.decided, approval.requested, approval.resolved,
                tool.previewed, policy.decided, tool.started, tool.finished, tool.verified]
  tool_outcomes: [executed]
  rules: [approval.approved, zone.secrets.read]
