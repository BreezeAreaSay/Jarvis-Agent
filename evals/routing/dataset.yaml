  - {text: "включи калькулятор", expect: direct, intent: app.launch, entity: calc, tags: [ru, launch, synonym]}
  - {text: "запусти телегу плз", expect: direct, intent: app.launch, entity: telegram, tags: [ru, launch, colloquial]}
  - {text: "запусти ворд пожалуйста", expect: direct, intent: app.launch, entity: word, tags: [ru, launch, colloquial]}
  - {text: "открой «Discord»", expect: direct, intent: app.launch, entity: discord, tags: [ru, launch, adversarial]}
  - {text: "open telegram", expect: direct, intent: app.launch, entity: telegram, tags: [en, launch]}
  - {text: "please open firefox", expect: direct, intent: app.launch, entity: firefox, tags: [en, launch]}
  - {text: "start chrome", expect: direct, intent: app.launch, entity: chrome, tags: [en, launch]}
  - {text: "launch the browser", expect: direct, intent: app.launch, entity: firefox, tags: [en, launch, synonym]}
  - {text: "run notepad", expect: direct, intent: app.launch, entity: notepad, tags: [en, launch]}
