[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Локальный Agent Runtime для ПК"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psutil>=5.9",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.scripts]
jarvis = "jarvis.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "anyio>=4.4",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "import-linter>=2.1",
  "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# Код в документации — эскизы интерфейсов, а не модули для форматирования.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET"]
# Cyrillic in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/jarvis/domain", "src/jarvis/ports", "src/jarvis/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

# Правило зависимостей (01-structure.md §4). Модули стандартной библиотеки и файловый ввод-вывод
# дополнительно проверяет AST-тест в tests/architecture.
[tool.importlinter]
root_package = "jarvis"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои"
type = "layers"
layers = [
  "jarvis.cli",
  "jarvis.evals",
  "jarvis.app",
  "jarvis.adapters | jarvis.core | jarvis.config",
  "jarvis.ports",
  "jarvis.domain",
]

[[tool.importlinter.contracts]]
name = "Ядро не знает инфраструктуры"
type = "forbidden"
source_modules = ["jarvis.domain", "jarvis.ports", "jarvis.core"]
forbidden_modules = [
  "jarvis.adapters", "jarvis.app", "jarvis.config", "jarvis.evals", "jarvis.cli",
  "yaml", "typer", "click",
]

[[tool.importlinter.contracts]]
name = "Адаптеры видят только порты и домен"
type = "forbidden"
source_modules = ["jarvis.adapters"]
forbidden_modules = ["jarvis.core", "jarvis.app", "jarvis.config", "jarvis.evals", "jarvis.cli"]

[[tool.importlinter.contracts]]
name = "Адаптеры не зависят друг от друга"
type = "independence"
# Инструменты не видят хранилищ: трассу и аудит пишет только Tool Runtime; бэкенды моделей не видят
# ни хранилищ, ни инструментов: модель ничего не исполняет сама. Инструмент запуска видит инвентарь только
# через порт.
modules = [
  "jarvis.adapters.memory", "jarvis.adapters.sqlite", "jarvis.adapters.clock", "jarvis.adapters.tools",
  "jarvis.adapters.models", "jarvis.adapters.inventory",
]
