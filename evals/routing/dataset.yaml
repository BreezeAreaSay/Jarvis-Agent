  - {text: "перейди на habr.com", expect: direct, intent: url.open, entity: "https://habr.com", tags: [ru, url, synonym]}
  - {text: "зайди на python.org", expect: direct, intent: url.open, entity: "https://python.org", tags: [ru, url, colloquial]}
  - {text: "открой https://docs.python.org/3/", expect: direct, intent: url.open, entity: "https://docs.python.org/3/", tags: [ru, url]}
  - {text: "open https://example.com/path?q=1", expect: direct, intent: url.open, entity: "https://example.com/path?q=1", tags: [en, url]}
