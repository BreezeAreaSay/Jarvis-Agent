# Вертикальный срез: задача → scripted-стадия → filesystem.search → preview → политика → исполнение
# → проверка → трасса и аудит → COMPLETED. Шаблон без учёта регистра, порядок — стабильный.
id: tool.search
category: tools
input: "scripted: найди все PDF в рабочей папке"
files:
  docs/report.pdf: ""
  docs/notes.txt: "заметки"
  docs/old/scan.PDF: ""
  music/song.mp3: ""
script:
  - {status: ROUTING, next: EXECUTING, route: direct}
  - status: EXECUTING
    next: VERIFYING
    tool: {id: filesystem.search, arguments: {root: ".", pattern: "*.pdf"}, expect: executed}
  - {status: VERIFYING, next: COMPLETED, answer: "найдено 2 PDF"}
expect:
  status: COMPLETED
  transitions: [ROUTING, EXECUTING, VERIFYING, COMPLETED]
  usage: {tool_calls: 1}
  tool_events: [tool.previewed, policy.decided, tool.started, tool.finished, tool.verified]
  tool_outcomes: [executed]
  rules: [effect.read]
  found: [docs/report.pdf, docs/old/scan.PDF]
