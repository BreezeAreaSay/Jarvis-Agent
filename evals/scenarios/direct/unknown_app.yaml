# Опечатка в имени: Router не угадывает, задачу ведёт агент на модели.
id: direct.unknown_app
category: direct
input: "открой телегарм"
inventory:
  apps:
    - {id: telegram, name: Telegram Desktop, aliases: [телеграм], target: "C:/Apps/Telegram.lnk", kind: shortcut}
model:
  replies:
    - json: {decision: "Такого приложения нет", action: {type: finish, answer: "Не нашёл приложение «телегарм». Может быть, Telegram?", evidence: []}}
expect:
  status: COMPLETED
  strategy: agent
  route_rules: [agent.default, direct.reject.unknown_app]
  launched: []
  usage: {model_calls: 1}
