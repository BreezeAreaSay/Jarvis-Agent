<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <title>Jarvis — пульт</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5v14L8 12z"/><path d="M6 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l11-7z"/><path d="M18 5v14"/></symbol>
    <symbol id="i-vol-down" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 12h4"/></symbol>
    <symbol id="i-vol-up" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 12h4M19 10v4"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></symbol>
    <symbol id="i-windows" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.3 1.5A3.3 3.3 0 0 0 7 18z"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  </svg>

  <main class="app" id="app">
    <header class="top">
      <div class="brand">
        <div class="orb" id="orb" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="brand-text">
          <div class="title" id="title">Jarvis</div>
          <div class="subtitle" id="pc">Подключаюсь…</div>
        </div>
      </div>
      <div class="link" id="link" role="status"><span class="dot"></span><span id="link-text">…</span></div>
    </header>

    <section class="card ask-card" aria-label="Команда для Jarvis">
      <form class="ask" id="ask-form" autocomplete="off">
        <input id="ask" type="text" placeholder="Скажите Джарвису…" enterkeyhint="send" maxlength="2000"
               autocapitalize="sentences" aria-label="Команда или вопрос для Jarvis">
        <button type="button" class="round hidden" id="mic" aria-label="Сказать голосом">
          <svg><use href="#i-mic"/></svg>
        </button>
        <button type="submit" class="round accent" id="send" aria-label="Отправить">
          <svg><use href="#i-send"/></svg>
        </button>
      </form>
      <div class="answer hidden" id="answer" aria-live="polite">
        <div class="answer-head">
          <span class="answer-title" id="answer-title"></span>
          <button type="button" class="ghost" id="answer-close" aria-label="Скрыть ответ">
            <svg><use href="#i-close"/></svg>
          </button>
        </div>
        <div class="answer-text" id="answer-text"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="media-h">
      <h2 id="media-h">Медиа</h2>
      <div class="now">
        <div class="cover" id="cover">
          <svg><use href="#i-note"/></svg>
          <img id="cover-img" alt="" class="hidden">
        </div>
        <div class="track">
          <div class="track-title" id="track-title">Ничего не играет</div>
          <div class="track-sub" id="track-sub">Включите музыку на компьютере</div>
        </div>
      </div>
      <div class="grid g3">
        <button class="tile" data-media="prev"><svg><use href="#i-prev"/></svg><span>Назад</span></button>
        <button class="tile primary" data-media="play_pause">
          <svg id="pp-icon"><use href="#i-pause"/></svg><span id="pp-label">Пауза</span>
        </button>
        <button class="tile" data-media="next"><svg><use href="#i-next"/></svg><span>Дальше</span></button>
        <button class="tile" data-media="volume_down"><svg><use href="#i-vol-down"/></svg><span>Тише</span></button>
        <button class="tile" data-media="mute">
          <svg id="mute-icon"><use href="#i-mute"/></svg><span id="mute-label">Без звука</span>
        </button>
        <button class="tile" data-media="volume_up"><svg><use href="#i-vol-up"/></svg><span>Громче</span></button>
      </div>
      <label class="volume">
        <svg><use href="#i-speaker"/></svg>
        <input type="range" id="volume" min="0" max="100" step="1" value="0" aria-label="Громкость">
        <span class="volume-value" id="volume-value">—</span>
      </label>
    </section>

    <section class="card" aria-labelledby="system-h">
      <h2 id="system-h">Система</h2>
      <div class="grid g-system">
        <button class="tile" data-action="minimize_all"><svg><use href="#i-windows"/></svg><span>Сверни всё</span></button>
        <button class="tile" data-action="screenshot"><svg><use href="#i-camera"/></svg><span>Скриншот</span></button>
        <button class="tile" data-action="sleep"><svg><use href="#i-moon"/></svg><span>Сон</span></button>
        <button class="tile wide" data-action="lock"><svg><use href="#i-lock"/></svg><span>Заблокировать</span></button>
        <button class="tile wide danger" data-action="shutdown"><svg><use href="#i-power"/></svg><span>Выключить</span></button>
      </div>
    </section>

    <section class="card" aria-labelledby="commands-h">
      <h2 id="commands-h">Команды</h2>
      <div class="grid g2" id="commands">
        <div class="empty">Загружаю…</div>
      </div>
    </section>

    <footer class="foot">Jarvis · пульт в телефоне</footer>
  </main>

  <div class="denied hidden" id="denied">
    <div class="denied-card">
      <svg><use href="#i-lock"/></svg>
      <h1>Нет доступа</h1>
      <p>Откройте ссылку или отсканируйте QR-код в приложении Jarvis: «Пульт в телефоне» → «В браузере».</p>
    </div>
  </div>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-text" id="sheet-text"></div>
      <div class="sheet-actions">
        <button type="button" class="btn" id="sheet-cancel">Отмена</button>
        <button type="button" class="btn danger" id="sheet-ok">Да</button>
      </div>
    </div>
  </div>

  <div class="viewer hidden" id="viewer" role="dialog" aria-modal="true" aria-label="Скриншот">
    <div class="viewer-bar">
      <span>Скриншот</span>
      <div class="viewer-buttons">
        <button type="button" class="ghost" id="viewer-refresh" aria-label="Обновить"><svg><use href="#i-refresh"/></svg></button>
        <button type="button" class="ghost" id="viewer-close" aria-label="Закрыть"><svg><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="viewer-body">
      <div class="spinner" id="viewer-spinner"></div>
      <img id="viewer-img" alt="Скриншот экрана компьютера">
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
