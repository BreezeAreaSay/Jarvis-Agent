# Поиск по шаблону во вложенных папках.
id: agent.search
category: agent
input: "найди все pdf в проекте"
files:
  docs/a.pdf: "%PDF"
  docs/old/b.PDF: "%PDF"
  readme.md: "текст"
model:
  replies:
    - json: {decision: "Ищу pdf во всех папках", action: {type: tool, tool: filesystem.search, arguments: {root: ".", pattern: "*.pdf"}}}
    - json: {decision: "Нашлось два файла", action: {type: finish, answer: "Нашлись docs/a.pdf и docs/old/b.PDF.", evidence: [task_1.call_1]}}
expect:
  status: COMPLETED
  observations: [executed]
  answer_contains: ["a.pdf", "b.PDF"]
