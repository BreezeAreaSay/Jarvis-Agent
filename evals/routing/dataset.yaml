  - {text: "покажи содержимое папки загрузки", expect: direct, intent: fs.list, entity: "folder:downloads", tags: [ru, list]}
  - {text: "что здесь лежит", expect: direct, intent: fs.list, entity: "/work", tags: [ru, list]}
  - {text: "покажи files", expect: direct, intent: fs.list, entity: "/work", tags: [mixed, list]}
  - {text: "ls", expect: direct, intent: fs.list, entity: "/work", tags: [en, list]}
  - {text: "list files", expect: direct, intent: fs.list, entity: "/work", tags: [en, list]}
  - {text: "what's in downloads", expect: direct, intent: fs.list, entity: "folder:downloads", tags: [en, list]}

  # --- fs.search --------------------------------------------------------------------------------
  - {text: "найди README", expect: direct, intent: fs.search, entity: "README*", tags: [mixed, search]}
  - {text: "найди файл config.toml", expect: direct, intent: fs.search, entity: "config.toml", tags: [mixed, search]}
  - {text: "найди все pdf", expect: direct, intent: fs.search, entity: "*.pdf", tags: [ru, search]}
  - {text: "найди все pdf файлы", expect: direct, intent: fs.search, entity: "*.pdf", tags: [ru, search]}
  - {text: "где лежит docker-compose.yml", expect: direct, intent: fs.search, entity: "docker-compose.yml", tags: [mixed, search]}
  - {text: "найди *.log", expect: direct, intent: fs.search, entity: "*.log", tags: [ru, search]}
  - {text: "find all png files", expect: direct, intent: fs.search, entity: "*.png", tags: [en, search]}
  - {text: "find LICENSE", expect: direct, intent: fs.search, entity: "LICENSE*", tags: [en, search]}
