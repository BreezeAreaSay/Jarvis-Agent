# filesystem.list: содержимое одной папки в детерминированном порядке (без учёта регистра).
id: tool.list
category: tools
input: "scripted: что лежит в docs?"
files:
  docs/b.txt: "b"
  docs/A.md: "a"
  docs/sub/: ""
  docs/sub/inner.txt: "не показывается: это вложенная папка"
script:
  - {status: ROUTING, next: EXECUTING, route: direct}
  - status: EXECUTING
    next: VERIFYING
    tool: {id: filesystem.list, arguments: {path: docs}, expect: executed}
  - {status: VERIFYING, next: COMPLETED, answer: "три записи"}
expect:
  status: COMPLETED
  tool_events: [tool.previewed, policy.decided, tool.started, tool.finished, tool.verified]
  rules: [effect.read]
  found: [docs/A.md, docs/b.txt, docs/sub]
