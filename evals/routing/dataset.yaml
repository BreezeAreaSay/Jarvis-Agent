  - {text: "открой OBS", expect: direct, intent: app.launch, entity: obs, tags: [mixed, launch]}
  - {text: "запусти питон", expect: clarify, tags: [ru, launch, ambiguous]}
  - {text: "open python", expect: clarify, tags: [en, launch, ambiguous]}

  # --- url.open ---------------------------------------------------------------------------------
