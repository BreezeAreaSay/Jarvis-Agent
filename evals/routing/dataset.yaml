# Набор фраз Router (ADR 0026): точность прямых команд важнее полноты.
#
# expect: direct | agent | clarify. Для direct — intent и entity (главная сущность: ID приложения из
# инвентаря, нормализованный адрес, папка, шаблон поиска, имя процесса; известная папка —
# folder:<id>). Ложный DIRECT (фраза, которой нужен агент, исполнилась бы командой) и DIRECT не того
# действия недопустимы: их должно быть 0. Пропущенная прямая команда допустима в пределах порога
# полноты — её просто выполнит агент.
#
# Теги: язык (ru, en, mixed) и вид случая. hard_negative — похоже на команду, но это вопрос, просьба о
# другом или составная задача; typo, colloquial, synonym, ambiguous, adversarial — опечатки, разговорные
# формы, синонимы, неоднозначность, попытки протащить лишнее.
kind: routing_dataset
id: routing.core
description: "Прямые команды V2.1 и трудные отрицательные примеры: RU, EN, смешанные, опечатки, атаки"
working_directory: /work
thresholds:
  min_direct_recall: 0.9
  max_p95_ms: 50
inventory:
  default_browser: firefox
  folders:
    home: "."
    downloads: Downloads
    documents: Documents
    desktop: Desktop
    pictures: Pictures
    music: Music
    videos: Videos
  apps:
    - {id: telegram, name: Telegram Desktop, aliases: [telegram, телеграм, телеграмм, телегу, телега], target: "C:/Apps/Telegram.lnk", kind: shortcut}
    - {id: firefox, name: Mozilla Firefox, aliases: [firefox, фаерфокс, файрфокс], target: "C:/Apps/Firefox.lnk", kind: shortcut}
    - {id: chrome, name: Google Chrome, aliases: [chrome, хром, гугл хром], target: "C:/Apps/Chrome.lnk", kind: shortcut}
    - {id: vscode, name: Visual Studio Code, aliases: [vs code, vscode, вс код], target: "C:/Apps/Code.lnk", kind: shortcut}
    - {id: notepad, name: Блокнот, aliases: [notepad], target: "C:/Apps/Notepad.lnk", kind: shortcut}
    - {id: calc, name: Калькулятор, aliases: [calculator, calc], target: "C:/Apps/Calculator.lnk", kind: shortcut}
    - {id: word, name: Word, aliases: [microsoft word, ворд], target: "C:/Apps/Word.lnk", kind: shortcut}
    - {id: excel, name: Excel, aliases: [microsoft excel, эксель], target: "C:/Apps/Excel.lnk", kind: shortcut}
    - {id: steam, name: Steam, aliases: [стим], target: "C:/Apps/Steam.lnk", kind: shortcut}
    - {id: discord, name: Discord, aliases: [дискорд], target: "C:/Apps/Discord.lnk", kind: shortcut}
    - {id: spotify, name: Spotify, aliases: [спотифай], target: "C:/Apps/Spotify.lnk", kind: shortcut}
    - {id: obs, name: OBS Studio, aliases: [obs], target: "C:/Apps/OBS.lnk", kind: shortcut}
    # Две версии Python с общими алиасами: «запусти питон» — вопрос человеку, а не выбор наугад.
    - {id: python-3-12, name: "Python 3.12 (64-bit)", aliases: [python, питон], target: "C:/Apps/Python312.lnk", kind: shortcut}
    - {id: python-3-13, name: "Python 3.13 (64-bit)", aliases: [python, питон], target: "C:/Apps/Python313.lnk", kind: shortcut}
