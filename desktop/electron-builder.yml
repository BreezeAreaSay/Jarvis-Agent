# Установщик Windows: Electron + встроенный Python с ядром (resources/core, готовит scripts/build-core-win.sh).
appId: com.breezeareasay.jarvis
productName: Jarvis
copyright: "© 2026 BreezeAreaSay"
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
extraResources:
  - from: ../build/core-win
    to: core
    filter: ["**/*"]
  - from: build/icon.png
    to: icon.png
  - from: build/tray.ico
    to: tray.ico
  - from: build/tray.png
    to: tray.png
  # значок в трее, когда микрофон выключен и когда идёт запись конспекта
  - from: build/tray-off.ico
    to: tray-off.ico
  - from: build/tray-off.png
    to: tray-off.png
  - from: build/tray-rec.ico
    to: tray-rec.ico
  - from: build/tray-rec.png
    to: tray-rec.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Jarvis-Setup-${version}.exe
  # подпись — если задан сертификат (CSC_LINK и CSC_KEY_PASSWORD, см. scripts/build-win.ps1 -Certificate);
  # без него — как раньше, без подписи. Подписанную версию выпустили — дальше подписывать все: обновление
  # проверяет издателя по подписи установленной версии
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jarvis
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages: [ru_RU]
  language: "1049"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
# обновления из приложения (electron-updater): релизы GitHub; сборка сама ничего не публикует (--publish never),
# файлы релиза кладёт scripts/publish-release.ps1
publish:
  provider: github
  owner: BreezeAreaSay
  repo: Jarvis-Agent
  releaseType: release
