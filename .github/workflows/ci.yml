name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv sync
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q -m "not live"
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1 -Path scripts | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $bad++; Write-Host "::error file=$($_.FullName)::$($errors[0].Message)" }
            else { Write-Host "ok $($_.Name)" }
          }
          exit $bad
